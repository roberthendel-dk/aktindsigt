  const eSheet = findSheet(book, 'Hændelser');
  const isOld = !eSheet && !(aRows.length && pick(aRows[0], 'ID') !== '') && aRows.some(r => r[norm('Historik JSON')] !== undefined);
  const st = emptyState(), notes = [], usedIds = new Set(); let assigned = 0;
  const newId = v => { let id = str(v); if (!id || usedIds.has(id)) { id = uid(); assigned++; } usedIds.add(id); return id; };
  const parseHist = v => { try { const x = typeof v === 'string' && v.trim() ? JSON.parse(v) : []; return Array.isArray(x) ? x : []; } catch { return []; } };

  aRows.forEach(r => {
    const a = {
      id: newId(pick(r, 'ID')), emne: str(pick(r, 'Titel/emne', 'Titel / emne', 'Emne', 'Titel')), myndighed: str(pick(r, 'Myndighed')),
      journalist: str(pick(r, 'Journalist')), sagsnr: str(pick(r, 'Sagsnummer', 'Sagsnr')), dato: normDate(pick(r, 'Anmodningsdato', 'Dato')),
      frist: normDate(pick(r, 'Gældende svarfrist')), svardato: normDate(pick(r, 'Faktisk svardato', 'Svardato')),
      status: str(pick(r, 'Status')) || 'Under behandling', medhold: str(pick(r, 'Afgørelse', 'Afgørelse/Medhold')) || 'Afventer', bemaerkning: str(pick(r, 'Bemærkninger', 'Bemærkning'))
    };
    // Samme som lovfristen (eller den gamle apps automatiske frist): lad fristen være automatisk
    if (a.frist && (a.frist === addWorkdays(a.dato, LOVFRIST) || a.frist === normDate(pick(r, 'Oprindelig svarfrist')))) a.frist = '';
    st.akt.push(a);
    parseHist(r[norm('Historik JSON')]).forEach(h => st.events.push({ id: uid(), sagId: a.id, sagType: 'akt', type: str(h.type) || 'Notat', dato: normDate(h.dato), nyFrist: normDate(h.nyFrist), note: str(h.note) }));
  });
  let unlinked = 0;
  kRows.forEach(r => {
    const aid = str(pick(r, 'Aktindsigt-ID')), sn = str(pick(r, 'Relateret Aktindsigt Sagsnr')), em = str(pick(r, 'Aktindsigt (emne)', 'Relateret Emne'));
    let a = aid && st.akt.find(x => x.id === aid);
    if (!a && sn) a = st.akt.find(x => x.sagsnr && x.sagsnr === sn);
    if (!a && em) { const m = st.akt.filter(x => norm(x.emne) === norm(em)); if (m.length === 1) a = m[0]; else if (m.length > 1) notes.push(`Klagen “${em}” passer på flere aktindsigter. Vælg den rigtige under Klageregnskab.`); }
    const k = {
      id: newId(pick(r, 'ID')), aktId: a ? a.id : '', sagsnr: str(pick(r, 'Klagesagsnummer')), instans: str(pick(r, 'Klageinstans')) || 'Anden',
      dato: normDate(pick(r, 'Klagedato')), frist: normDate(pick(r, 'Forventet afgørelse')), status: str(pick(r, 'Status')) || 'Under behandling',
      resultat: str(pick(r, 'Resultat', 'Klageresultat/Medhold')) || 'Afventer', genbehandlingFrist: normDate(pick(r, 'Genbehandlingsfrist')), bemaerkning: str(pick(r, 'Bemærkninger'))
    };
    if (!a) { unlinked++; k._emne = em; }
    st.klager.push(normKlage(k));
    parseHist(r[norm('Historik JSON')]).forEach(h => st.events.push({ id: uid(), sagId: k.id, sagType: 'klage', type: str(h.type) || 'Notat', dato: normDate(h.dato), nyFrist: normDate(h.nyFrist), note: str(h.note) }));
  });
  if (eSheet) {
    let lost = 0;
    sheetObjects(eSheet).forEach(r => {
      const sagId = str(pick(r, 'Sags-ID'));
      const isA = st.akt.some(a => a.id === sagId), isK = st.klager.some(k => k.id === sagId);
      if (!isA && !isK) { lost++; return; }
      st.events.push({ id: newId(pick(r, 'ID')), sagId, sagType: isK ? 'klage' : 'akt', type: str(pick(r, 'Type')) || 'Notat', dato: normDate(pick(r, 'Dato')), nyFrist: normDate(pick(r, 'Ny frist')), note: str(pick(r, 'Notat')) });
    });
    if (lost) notes.push(`${lost} hændelse${lost === 1 ? '' : 'r'} i filen pegede på en sag, der ikke findes, og blev sprunget over.`);
  }
  const tSheet = findSheet(book, 'Papirkurv');
  if (tSheet) sheetObjects(tSheet).forEach(r => {
    try { const data = JSON.parse(pick(r, 'Data (rør ikke)', 'Data')); st.trash.push({ id: newId(pick(r, 'ID')), type: norm(pick(r, 'Type')) === 'klage' ? 'klage' : 'akt', titel: str(pick(r, 'Titel')), slettet: normDate(pick(r, 'Slettet')), data }); } catch { }
  });
  if (unlinked) notes.unshift(`${unlinked} klage${unlinked === 1 ? '' : 'r'} kunne ikke kobles til en aktindsigt. Du kan koble ${unlinked === 1 ? 'den' : 'dem'} under Klageregnskab.`);
  const noDate = st.akt.filter(a => !a.dato).length;
  if (noDate) notes.push(`${noDate} aktindsigt${noDate === 1 ? '' : 'er'} mangler anmodningsdato, så fristen kan ikke beregnes.`);
  if (assigned && !isOld) notes.push(`${assigned} række${assigned === 1 ? '' : 'r'} uden ID (fx tilføjet i Excel) har fået et ID. Gem filen, så ID'erne bliver skrevet ind.`);
  return { state: st, isOld, notes, assigned: !isOld && assigned > 0 };
}

/* =====================================================================
   Filhåndtering
   ===================================================================== */
const XLSX_TYPES = [{ description: 'Excel-fil', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }];
const canFS = 'showOpenFilePicker' in window && 'showSaveFilePicker' in window;
const IDB = 'aktindsigt_v4_handles_test';
function idb() { return new Promise((res, rej) => { const r = indexedDB.open(IDB, 1); r.onupgradeneeded = () => r.result.createObjectStore('h'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function rememberHandle(h) { lastName = h?.name || ''; try { const db = await idb(); db.transaction('h', 'readwrite').objectStore('h').put(h, 'last'); } catch { } }
async function forgetHandle() { lastName = ''; try { const db = await idb(); db.transaction('h', 'readwrite').objectStore('h').delete('last'); } catch { } }
async function recallHandle() { try { const db = await idb(); return await new Promise(res => { const r = db.transaction('h').objectStore('h').get('last'); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }); } catch { return null; } }

const confirmDiscard = () => !dirty || confirm('Du har ændringer, der ikke er gemt i Excel-filen. Vil du kassere dem?');

async function openFile() {
  if (!confirmDiscard()) return;
  if (canFS) {
    try { const [h] = await window.showOpenFilePicker({ types: XLSX_TYPES, multiple: false }); await loadFile(await h.getFile(), h); }
    catch (e) { if (e.name !== 'AbortError') showError('Filen kunne ikke åbnes', e); }
  } else $('fileInput').click();
}

async function loadFile(file, handle, dbxMeta, quiet) {
  const buf = await file.arrayBuffer();
  const book = await readXlsx(buf);
  const { state, isOld, notes, assigned } = bookToState(book);
  S = state; fileHandle = handle || null; fileName = file.name; fileModified = file.lastModified; dirty = !!assigned; oldFormat = isOld; handlePending = false;
  conflict = null; autoErr = ''; lastSavedAt = 0; clearTimeout(autoTimer);
  if (dbxMeta) setDbxSource(dbxMeta); else { setDbxSource(null); if (handle) rememberHandle(handle); else forgetHandle(); }
  saveLocal(); render();
  const msg = `${dbxMeta ? 'Hentet fra Dropbox' : 'Indlæst'}: ${S.akt.length} aktindsigter, ${S.klager.length} klager, ${S.events.length} hændelser.`;
  if (notes.length || isOld) {
    openModal('Filen er åbnet', `<p>${esc(msg)}</p>${isOld ? '<p><b>Filen er i det gamle format.</b> Alt er læst ind. Når du trykker “Gem Excel”, konverteres filen til det nye format med ID-kolonner, rigtige datoer og et ark med hændelser. Tag eventuelt en kopi af den gamle fil først.</p>' : ''}${notes.length ? '<ul>' + notes.map(n => `<li>${esc(n)}</li>`).join('') + '</ul>' : ''}<div class="formbtns mt"><button class="btn primary" data-action="close">OK</button></div>`);
  } else toast(msg);
}

async function writeToHandle(h) {
  const bytes = await buildXlsx(workbookSheets());
  const w = await h.createWritable(); await w.write(bytes); await w.close();
  fileModified = (await h.getFile()).lastModified;
}
function lockedMsg(e) {
  if (['NoModificationAllowedError', 'InvalidStateError', 'NotReadableError'].includes(e?.name)) return 'Filen er måske åben i Excel. Luk den i Excel, og prøv igen.';
  return e?.message || String(e);
}

async function saveFile() {
  if (dbx) return dbxSave();
  if (!fileHandle && handlePending) {
    const h = await recallHandle();
    if (h) {
      try {
        if (await h.requestPermission({ mode: 'readwrite' }) !== 'granted') { toast('Browseren fik ikke lov at skrive i filen.'); return; }
        const f = await h.getFile();
        if (backupAt && f.lastModified > backupAt + 1000 && !confirm(`“${h.name}” er blevet ændret, efter at appen sidst gemte sin kopi, fx på en anden computer.\n\nVil du overskrive filen med det, du ser i appen nu?\n\nVælg Annuller, og tryk “Hent filen” for at hente den nyeste version i stedet.`)) return;
        fileHandle = h; fileModified = f.lastModified; handlePending = false;
      } catch (e) { showError('Filen kunne ikke åbnes', e); return; }
    }
  }
  if (!fileHandle) return saveAs();
  try {
    let p = await fileHandle.queryPermission({ mode: 'readwrite' });
    if (p !== 'granted') p = await fileHandle.requestPermission({ mode: 'readwrite' });
    if (p !== 'granted') { toast('Appen fik ikke lov at skrive i filen. Brug “Gem som…”.'); return; }
    const cur = await fileHandle.getFile();
    if (fileModified && cur.lastModified > fileModified + 1000 && !confirm(`“${fileName}” er blevet ændret uden for appen (fx i Excel), siden du åbnede den.\n\nVil du overskrive filen med appens data?\n\nVælg Annuller, og brug derefter “Åbn Excel”, hvis du vil hente ændringerne fra Excel i stedet.`)) return;
    await writeToHandle(fileHandle);
    dirty = false; oldFormat = false; handlePending = false; lastSavedAt = Date.now(); autoErr = ''; conflict = null; saveLocal(); render(); toast('Gemt i ' + fileName);
  } catch (e) { showError('Filen kunne ikke gemmes', { message: lockedMsg(e) }); }
}

async function saveAs() {
  const suggested = (fileName || 'Aktindsigt-og-klager.xlsx').replace(/\.xlsx$/i, '') + '.xlsx';
  if (canFS) {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: suggested, types: XLSX_TYPES });
      await writeToHandle(h);
      fileHandle = h; fileName = h.name; dirty = false; oldFormat = false; handlePending = false; setDbxSource(null); rememberHandle(h); lastSavedAt = Date.now(); autoErr = ''; conflict = null; saveLocal(); render(); toast('Gemt som ' + fileName);
    } catch (e) { if (e.name !== 'AbortError') showError('Filen kunne ikke gemmes', { message: lockedMsg(e) }); }
  } else {
    try {
      const bytes = await buildXlsx(workbookSheets());
      const url = URL.createObjectURL(new Blob([bytes], { type: XLSX_TYPES[0].accept && 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
      const a = document.createElement('a'); a.href = url; a.download = suggested; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      fileName = suggested; dirty = false; oldFormat = false; saveLocal(); render();
      toast('Filen er hentet. Find den i mappen Overførsler.');
    } catch (e) { showError('Filen kunne ikke gemmes', e); }
  }
}

function newFile() {
  if (!confirmDiscard()) return;
  if (!dirty && (S.akt.length || S.klager.length) && !confirm('Starte en ny, tom fil? Den nuværende Excel-fil bliver ikke ændret.')) return;
  S = emptyState(); fileHandle = null; fileName = ''; dirty = false; oldFormat = false; handlePending = false; dbxPending = false; setDbxSource(null); forgetHandle(); saveLocal(); render();
}

async function openRecent() {
  const h = await recallHandle();
  if (!h) { toast('Appen kan ikke finde den senest brugte fil. Vælg “Åbn Excel-fil…”.'); return; }
  if (!confirmDiscard()) return;
  try {
    if (await h.requestPermission({ mode: 'readwrite' }) !== 'granted') { toast('Browseren fik ikke lov at åbne filen.'); return; }
    await loadFile(await h.getFile(), h);
  } catch (e) { showError('Filen kunne ikke åbnes', { message: e?.name === 'NotFoundError' ? `“${h.name}” findes ikke længere det sted, den lå. Vælg “Åbn Excel-fil…” for at finde den.` : (e?.message || String(e)) }); }
}

async function reconnect() {
  const h = await recallHandle(); if (!h) { handlePending = false; render(); return; }
  try {
    if (dirty && h.name !== fileName && !confirmDiscard()) return;
    const p = await h.requestPermission({ mode: 'readwrite' });
    if (p !== 'granted') { toast('Browseren fik ikke lov at åbne filen.'); return; }
    const f = await h.getFile();
    if (!dirty || h.name !== fileName) { dirty = false; await loadFile(f, h); }
    else { fileHandle = h; handlePending = false; fileModified = f.lastModified; render(); toast('Forbundet til ' + h.name + '. Husk at gemme dine ændringer.'); }
  } catch (e) { showError('Filen kunne ikke åbnes', e); }
}

function showError(title, e) {
  openModal(title, `<p class="err">${esc(e?.message || String(e))}</p><div class="formbtns mt"><button class="btn primary" data-action="close">OK</button></div>`);
}
function toast(s) { document.querySelectorAll('.toast').forEach(t => t.remove()); const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = s; document.body.appendChild(d); setTimeout(() => d.remove(), 3500); }


/* =====================================================================
   Dropbox: åbn og gem Excel-filen direkte i Dropbox (alle browsere, også iPhone/iPad)
   Logger ind med OAuth 2 + PKCE, så der ingen hemmelig nøgle ligger i appen.
   Appen har kun adgang til sin egen mappe: Dropbox/Apps/<appens navn>/
   ===================================================================== */
const DBX_AUTH_KEY = 'aktindsigt_dbx_auth_test', DBX_FILE_KEY = 'aktindsigt_dbx_file_test';
const DBX_REDIRECT = location.origin + location.pathname;
const dbxReady = () => !!DROPBOX_APP_KEY && /^https?:/.test(location.protocol);
let dbx = null, dbxPending = false, leavingForAuth = false;

const dbxAuth = () => { try { return JSON.parse(localStorage.getItem(DBX_AUTH_KEY) || 'null'); } catch { return null; } };
const setDbxAuth = a => a ? localStorage.setItem(DBX_AUTH_KEY, JSON.stringify(a)) : localStorage.removeItem(DBX_AUTH_KEY);
const setDbxFile = m => m ? localStorage.setItem(DBX_FILE_KEY, JSON.stringify(m)) : localStorage.removeItem(DBX_FILE_KEY);
const dbxStoredFile = () => { try { return JSON.parse(localStorage.getItem(DBX_FILE_KEY) || 'null'); } catch { return null; } };
const b64url = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const randStr = n => b64url(crypto.getRandomValues(new Uint8Array(n)));
const hdrJson = o => JSON.stringify(o).replace(/[\u007f-￿]/g, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));

class DbxError extends Error { constructor(msg, status, summary) { super(msg); this.status = status; this.summary = summary || ''; } }

async function dbxLogin(next) {
  if (!dbxReady()) { toast('Dropbox er ikke sat op i denne udgave af appen.'); return; }
  const verifier = randStr(48), state = randStr(16);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  sessionStorage.setItem('dbx_pkce', JSON.stringify({ verifier, state, next }));
  saveLocal(); leavingForAuth = true;
  const p = new URLSearchParams({ client_id: DROPBOX_APP_KEY, response_type: 'code', code_challenge: challenge, code_challenge_method: 'S256', redirect_uri: DBX_REDIRECT, token_access_type: 'offline', state });
  location.href = 'https://www.dropbox.com/oauth2/authorize?' + p;
}

/* Når Dropbox sender brugeren tilbage efter login. Returnerer den handling, der skal fortsættes med. */
async function dbxHandleReturn() {
  const u = new URL(location.href);
  if (!u.searchParams.has('code') && !u.searchParams.has('error')) return null;
  const pk = JSON.parse(sessionStorage.getItem('dbx_pkce') || 'null'); sessionStorage.removeItem('dbx_pkce');
  history.replaceState(null, '', DBX_REDIRECT);
  if (u.searchParams.has('error')) { toast('Du blev ikke logget ind i Dropbox.'); return null; }
  if (!pk || pk.state !== u.searchParams.get('state')) { toast('Login i Dropbox mislykkedes. Prøv igen.'); return null; }
  const r = await fetch('https://api.dropboxapi.com/oauth2/token', { method: 'POST', body: new URLSearchParams({ code: u.searchParams.get('code'), grant_type: 'authorization_code', code_verifier: pk.verifier, client_id: DROPBOX_APP_KEY, redirect_uri: DBX_REDIRECT }) });
  if (!r.ok) { toast('Login i Dropbox mislykkedes. Prøv igen.'); return null; }
  const t = await r.json();
  setDbxAuth({ refresh: t.refresh_token, access: t.access_token, exp: Date.now() + (t.expires_in || 14400) * 1000, account: t.account_id });
  return pk.next || 'open';
}

async function dbxToken(force) {
  const a = dbxAuth(); if (!a) throw new DbxError('login', 401);
  if (!force && a.access && a.exp > Date.now() + 60000) return a.access;
  const r = await fetch('https://api.dropboxapi.com/oauth2/token', { method: 'POST', body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: a.refresh, client_id: DROPBOX_APP_KEY }) });
  if (r.status === 400 || r.status === 401) { setDbxAuth(null); throw new DbxError('login', 401); }
  if (!r.ok) throw new DbxError('Dropbox svarede ikke. Prøv igen om lidt.', r.status);
  const t = await r.json();
  a.access = t.access_token; a.exp = Date.now() + (t.expires_in || 14400) * 1000; setDbxAuth(a);
  return a.access;
}

/* Kalder Dropbox og forsøger én gang igen med ny adgangsnøgle, hvis den er udløbet */
async function dbxFetch(url, opts, retry = true) {
  let r;
  try { r = await fetch(url, { ...opts, headers: { ...opts.headers, Authorization: 'Bearer ' + await dbxToken() } }); }
  catch (e) { if (e instanceof DbxError) throw e; throw new DbxError('Appen kunne ikke få forbindelse til Dropbox. Tjek internetforbindelsen.', 0); }
  if (r.status === 401 && retry) { await dbxToken(true); return dbxFetch(url, opts, false); }
  if (!r.ok) {
    let summary = ''; try { const j = await r.json(); summary = j.error_summary || ''; } catch { }
    throw new DbxError(summary.startsWith('path/not_found') ? 'Filen findes ikke længere i Dropbox.' : 'Dropbox gav en fejl: ' + (summary || r.status), r.status, summary);
  }
  return r;
}
const dbxRpc = async (ep, body) => (await dbxFetch('https://api.dropboxapi.com/2/' + ep, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })).json();

async function dbxDownload(path) {
  const r = await dbxFetch('https://content.dropboxapi.com/2/files/download', { method: 'POST', headers: { 'Dropbox-API-Arg': hdrJson({ path }) } });
  const meta = JSON.parse(r.headers.get('Dropbox-API-Result') || '{}');
  return { bytes: await r.arrayBuffer(), meta };
}
async function dbxUpload(path, bytes, mode) {
  const r = await dbxFetch('https://content.dropboxapi.com/2/files/upload', { method: 'POST', headers: { 'Content-Type': 'application/octet-stream', 'Dropbox-API-Arg': hdrJson({ path, mode, autorename: false, mute: true }) }, body: bytes });
  return r.json();
}
const isConflict = e => e instanceof DbxError && e.status === 409 && /conflict/.test(e.summary);
const needLogin = e => e instanceof DbxError && e.message === 'login';
function dbxFail(title, e, next) {
  if (needLogin(e)) { openModal('Log ind i Dropbox igen', `<p>Forbindelsen til Dropbox er udløbet eller blevet afbrudt. Log ind igen for at fortsætte. Dine data i appen bliver bevaret.</p><div class="formbtns mt"><button class="btn primary" data-action="dbx-login" data-next="${next || 'open'}">Log ind i Dropbox</button><button class="btn" data-action="close">Annuller</button></div>`); return; }
  showError(title, { message: e?.message || String(e) });
}

function setDbxSource(meta) {
  dbx = meta ? { path: meta.path_display || meta.path_lower || meta.path, name: meta.name, rev: meta.rev } : null;
  setDbxFile(dbx);
}

/* Vis Excel-filerne i appens Dropbox-mappe */
async function dbxPicker() {
  if (!dbxAuth()) return dbxLogin('open');
  openModal('Åbn fra Dropbox', '<p class="muted">Henter listen over filer…</p>');
  try {
    let res = await dbxRpc('files/list_folder', { path: '', recursive: false }), all = res.entries;
    while (res.has_more) { res = await dbxRpc('files/list_folder/continue', { cursor: res.cursor }); all = all.concat(res.entries); }
    const files = all.filter(f => f['.tag'] === 'file' && /\.xlsx$/i.test(f.name)).sort((a, b) => (b.server_modified || '').localeCompare(a.server_modified || ''));
    const when = s => { const d = new Date(s); return isNaN(d) ? '' : d.toLocaleString('da-DK', { dateStyle: 'medium', timeStyle: 'short' }); };
    $('modalBody').innerHTML = files.length
      ? `<p class="muted">Excel-filer i appens mappe i din Dropbox.</p><div class="register"><table><tbody>${files.map(f => `<tr><td><b>${esc(f.name)}</b><div class="meta">Ændret ${esc(when(f.server_modified))}</div></td><td style="text-align:right;vertical-align:middle"><button class="btn sm primary" data-action="dbx-open-file" data-path="${esc(f.path_display || f.path_lower)}">Åbn</button></td></tr>`).join('')}</tbody></table></div>
         <div class="formbtns mt"><button class="btn" data-action="close">Annuller</button><button class="linkbtn right" data-action="dbx-disconnect">Afbryd forbindelsen til Dropbox</button></div>`
      : `<p>Der er ingen Excel-filer i appens mappe i din Dropbox endnu. Mappen hedder <b>Apps</b> og ligger øverst i din Dropbox. Inde i den har appen sin egen mappe.</p>
         <p>Du kan enten lægge din Excel-fil i den mappe og prøve igen, eller åbne filen her i appen og vælge “Gem i Dropbox som…”.</p>
         <div class="formbtns mt"><button class="btn primary" data-action="dbx-open">Prøv igen</button><button class="btn" data-action="close">Luk</button></div>`;
  } catch (e) { closeModal(); dbxFail('Dropbox kunne ikke vise dine filer', e, 'open'); }
}

async function dbxOpen(path, quiet) {
  const { bytes, meta } = await dbxDownload(path);
  const file = new File([bytes], meta.name || path.split('/').pop(), { lastModified: Date.parse(meta.server_modified || '') || Date.now() });
  await loadFile(file, null, meta, quiet);
  dbxPending = false; render();
}

async function dbxSave() {
  let bytes;
  try {
    bytes = await buildXlsx(workbookSheets());
    let meta;
    try { meta = await dbxUpload(dbx.path, bytes, dbx.rev ? { '.tag': 'update', update: dbx.rev } : { '.tag': 'overwrite' }); }
    catch (e) {
      if (!isConflict(e)) throw e;
      if (!confirm(`“${dbx.name}” er blevet ændret i Dropbox, fx på en anden enhed, siden du hentede den.\n\nVil du overskrive filen i Dropbox med det, du ser i appen nu?\n\nVælg Annuller, hvis du hellere vil hente den nyeste version via Fil → Åbn fra Dropbox. Så mister du dog de ændringer, du ikke har gemt.`)) return;
      meta = await dbxUpload(dbx.path, bytes, { '.tag': 'overwrite' });
    }
    setDbxSource(meta); fileName = meta.name; dirty = false; oldFormat = false; dbxPending = false; lastSavedAt = Date.now(); autoErr = ''; conflict = null; saveLocal(); render(); toast('Gemt i Dropbox');
  } catch (e) { dbxFail('Filen kunne ikke gemmes i Dropbox', e, 'save'); }
}

function dbxSaveAsForm() {
  if (!dbxAuth()) return dbxLogin('saveas');
  const suggested = (fileName || 'Aktindsigt-og-klager.xlsx').replace(/\.xlsx$/i, '') + '.xlsx';
  openModal('Gem i Dropbox som…', `<form id="f" novalidate><label for="dbxName">Filnavn</label><input id="dbxName" name="name" value="${esc(suggested)}" autocomplete="off">
    <div class="hint">Filen gemmes i appens mappe i din Dropbox (Apps).</div><div class="err" id="ferr" role="alert"></div>
    <div class="formbtns mt"><button class="btn primary">Gem i Dropbox</button><button type="button" class="btn" data-action="close">Annuller</button></div></form>`);
  $('f').onsubmit = async ev => {
    ev.preventDefault();
    let name = $('dbxName').value.trim().replace(/[\\/:*?"<>|]/g, '-');
    if (!name) { $('ferr').textContent = 'Skriv et filnavn.'; return; }
    if (!/\.xlsx$/i.test(name)) name += '.xlsx';
    closeModal();
    try {
      const bytes = await buildXlsx(workbookSheets());
      let meta;
      try { meta = await dbxUpload('/' + name, bytes, { '.tag': 'add' }); }
      catch (e) {
        if (!isConflict(e)) throw e;
        if (!confirm(`Der findes allerede en fil, der hedder “${name}”, i Dropbox. Vil du overskrive den?`)) return;
        meta = await dbxUpload('/' + name, bytes, { '.tag': 'overwrite' });
      }
      setDbxSource(meta); fileHandle = null; handlePending = false; fileName = meta.name; dirty = false; oldFormat = false; dbxPending = false;
      lastSavedAt = Date.now(); autoErr = ''; conflict = null; saveLocal(); render(); toast('Gemt i Dropbox som ' + meta.name);
    } catch (e) { dbxFail('Filen kunne ikke gemmes i Dropbox', e, 'saveas'); }
  };
}

async function dbxDisconnect() {
  if (!confirm('Afbryde forbindelsen til Dropbox på denne enhed? Filen i Dropbox bliver ikke slettet, og dine data i appen bliver liggende.')) return;
  try { await dbxRpc('auth/token/revoke', null); } catch { }
  setDbxAuth(null);
  if (dbx) { setDbxSource(null); fileName = ''; dbxPending = false; }
  closeModal(); saveLocal(); render(); toast('Forbindelsen til Dropbox er afbrudt');
}

async function dbxStart(next) {
  const stored = dbxStoredFile();
  if (next === 'open') { await dbxPicker(); return; }
  if (next === 'saveas') { dbxSaveAsForm(); return; }
  if (!stored || !dbxAuth()) return;
  dbx = stored; fileName = stored.name; handlePending = false;
  if (next === 'save') { await dbxSave(); return; }
  if (dirty) { toast('Du har ændringer fra sidst, som ikke er gemt i Dropbox.'); return; }
  try { await dbxOpen(stored.path, true); }
  catch (e) { dbxPending = true; render(); if (needLogin(e)) dbxFail('', e, 'reload'); }
}


/* =====================================================================
   Automatisk gem og hentning af nyeste version
   Gemmer et par sekunder efter sidste ændring, når appen er forbundet til
   Dropbox eller (i Chrome/Edge) til en lokal fil. Overskriver aldrig en fil,
   der er ændret et andet sted: så stopper den og spørger.
   ===================================================================== */
const AUTO_KEY = LS_KEY + '_autosave';
let autoOn = (() => { try { return localStorage.getItem(AUTO_KEY) !== 'off'; } catch { return true; } })();
let autoTimer = null, retryTimer = null, saving = false, autoErr = '', conflict = null, lastSavedAt = 0, lastCheck = 0;

const autoTarget = () => (dbx && !dbxPending && dbxAuth()) ? 'dbx' : (fileHandle && canFS && !handlePending) ? 'local' : null;
const clock = t => new Date(t).toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' });

function scheduleAutoSave(delay = 2500) {
  clearTimeout(autoTimer);
  if (!autoOn || !dirty || conflict || !autoTarget()) return;
  autoTimer = setTimeout(autoSaveNow, delay);
}

/* Skriver til Dropbox eller den lokale fil. force = overskriv, selv om filen er ændret et andet sted. */
async function pushDbx(force) {
  const bytes = await buildXlsx(workbookSheets());
  const meta = await dbxUpload(dbx.path, bytes, !force && dbx.rev ? { '.tag': 'update', update: dbx.rev } : { '.tag': 'overwrite' });
  setDbxSource(meta); fileName = meta.name;
}
async function pushLocal(force) {
  const cur = await fileHandle.getFile();
  if (!force && fileModified && cur.lastModified > fileModified + 1000) { const e = new Error('conflict'); e.conflict = true; throw e; }
  await writeToHandle(fileHandle);
}
function markSaved() { dirty = false; oldFormat = false; autoErr = ''; lastSavedAt = Date.now(); clearTimeout(retryTimer); saveLocal(); render(); }

async function autoSaveNow() {
  const target = autoTarget();
  if (!autoOn || !dirty || conflict || !target) return;
  if (saving) { scheduleAutoSave(1500); return; }
  saving = true; renderFile();
  try {
    if (target === 'dbx') await pushDbx(false);
    else {
      if (await fileHandle.queryPermission({ mode: 'readwrite' }) !== 'granted') { autoErr = 'perm'; return; }
      await pushLocal(false);
    }
    markSaved();
  } catch (e) {
    if (isConflict(e) || e.conflict) { conflict = { src: target }; }
    else if (needLogin(e)) { autoErr = 'login'; }
    else { autoErr = target === 'local' && ['NoModificationAllowedError', 'InvalidStateError', 'NotReadableError'].includes(e?.name) ? 'locked' : 'net'; clearTimeout(retryTimer); retryTimer = setTimeout(autoSaveNow, 30000); }
  } finally { saving = false; render(); }
}

/* Når appen får fokus igen: hent nyeste version, hvis filen er ændret på en anden enhed */
async function checkRemote(forceNow) {
  if (saving || conflict || document.hidden) return;
  if (!forceNow && Date.now() - lastCheck < 15000) return;
  lastCheck = Date.now();
  try {
    const target = autoTarget();
    if (target === 'dbx') {
      const meta = await dbxRpc('files/get_metadata', { path: dbx.path });
      if (meta.rev === dbx.rev) return;
      if (!dirty) { await dbxOpen(dbx.path, true); toast('Den nyeste version er hentet fra Dropbox.'); }
      else { conflict = { src: 'dbx' }; render(); }
    } else if (target === 'local' && await fileHandle.queryPermission({ mode: 'read' }) === 'granted') {
      const f = await fileHandle.getFile();
      if (f.lastModified <= fileModified + 1000) return;
      if (!dirty) { await loadFile(f, fileHandle, null, true); toast('Filen er ændret uden for appen. Den nyeste version er hentet.'); }
      else { conflict = { src: 'local' }; render(); }
    }
  } catch { /* stille: prøver igen næste gang */ }
}

async function resolveConflict(keepMine) {
  const src = conflict?.src; if (!src) return;
  if (!keepMine && dirty && !confirm('Dine ændringer, som ikke er gemt, bliver kasseret, og den nyeste version af filen bliver hentet. Fortsæt?')) return;
  conflict = null; saving = true; render();
  try {
    if (keepMine) { src === 'dbx' ? await pushDbx(true) : await pushLocal(true); markSaved(); toast('Filen er overskrevet med dine ændringer.'); }
    else if (src === 'dbx') { await dbxOpen(dbx.path, true); }
    else { await loadFile(await fileHandle.getFile(), fileHandle, null, true); }
  } catch (e) { conflict = { src }; src === 'dbx' ? dbxFail('Det lykkedes ikke', e, 'reload') : showError('Det lykkedes ikke', { message: lockedMsg(e) }); }
  finally { saving = false; render(); }
}

function conflictBanner() {
  if (!conflict) return '';
  const where = conflict.src === 'dbx' ? 'i Dropbox, fx på en anden enhed' : 'uden for appen, fx i Excel';
  return `<div class="resume conflict"><div><b>${esc(fileName)} er ændret ${where}</b><div class="meta">Du har også ændringer her i appen. Appen har derfor ikke gemt automatisk, så intet er overskrevet. Vælg, hvilken version du vil beholde.</div></div>
    <div class="formbtns"><button class="btn" data-action="conflict-load">Hent den nyeste version</button><button class="btn primary" data-action="conflict-keep">Behold mine ændringer</button></div></div>`;
}

function toggleAuto() {
  autoOn = !autoOn;
  try { localStorage.setItem(AUTO_KEY, autoOn ? 'on' : 'off'); } catch { }
  render(); toast(autoOn ? 'Appen gemmer nu automatisk.' : 'Automatisk gem er slået fra. Husk at trykke “Gem”.');
  scheduleAutoSave(500);
}

document.addEventListener('visibilitychange', () => { if (!document.hidden) checkRemote(); });
window.addEventListener('focus', () => checkRemote());
window.addEventListener('online', () => { if (autoErr) scheduleAutoSave(500); });

/* =====================================================================
   Opstart
   ===================================================================== */
function migrateOldLocal() {
  // Data fra den gamle app (v3), hvis de findes i browseren
  try {
    const A = JSON.parse(localStorage.getItem('aktindsigter_db') || 'null'), K = JSON.parse(localStorage.getItem('klager_db') || 'null');
    if (!Array.isArray(A) || !A.length) return false;
    const conv = (list, kind) => list.map(x => kind === 'akt'
      ? { 'ID': x.id, 'Emne': x.emne, 'Myndighed': x.myndighed, 'Journalist': x.journalist, 'Sagsnummer': x.sagsnr, 'Anmodningsdato': x.dato, 'Gældende svarfrist': x.frist, 'Faktisk svardato': x.svardato, 'Status': x.status, 'Afgørelse/Medhold': x.medhold, 'Bemærkninger': x.bemaerkning, 'Historik JSON': JSON.stringify(x.historik || []) }
      : { 'ID': x.id, 'Aktindsigt-ID': x.aktId, 'Klagesagsnummer': x.sagsnr, 'Klageinstans': x.instans, 'Klagedato': x.dato, 'Forventet afgørelse': x.frist, 'Status': x.status, 'Klageresultat/Medhold': x.resultat, 'Genbehandlingsfrist': x.genbehandlingFrist, 'Bemærkninger': x.bemaerkning, 'Historik JSON': JSON.stringify(x.historik || []) });
    const toGrid = rows => { const h = [...new Set(rows.flatMap(Object.keys))]; return [h, ...rows.map(r => h.map(k => r[k] ?? ''))]; };
    const book = { 'Aktindsigter': toGrid(conv(A, 'akt')), 'Klagesager': toGrid(conv(Array.isArray(K) ? K : [], 'klage')) };
    S = bookToState(book).state; dirty = true; fileName = '';
    return true;
  } catch { return false; }
}

async function start() {
  let restored = false;
  try {
    const b = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (b && b.S) { S = { ...emptyState(), ...b.S }; S.klager.forEach(normKlage); fileName = b.fileName || ''; dirty = !!b.dirty; oldFormat = !!b.oldFormat; restored = true; backupAt = Date.parse(b.savedAt || '') || 0; }
  } catch { }
  if (false && !restored && migrateOldLocal()) toast('Data fra den gamle version er hentet fra browseren. Gem dem i en Excel-fil.');
  let next = null;
  if (dbxReady()) { try { next = await dbxHandleReturn(); } catch { toast('Login i Dropbox mislykkedes. Prøv igen.'); } }
  const useDbx = dbxReady() && !!dbxStoredFile() && !!dbxAuth();
  if (canFS) {
    const h = await recallHandle();
    lastName = h?.name || '';
    if (h && !useDbx && (!fileName || h.name === fileName)) {
      if (!fileName) fileName = h.name;
      try {
        const p = await h.queryPermission({ mode: 'readwrite' });
        if (p === 'granted') {
          fileHandle = h; const f = await h.getFile();
          if (!dirty) await loadFile(f, h); else fileModified = f.lastModified;
        } else handlePending = true;
      } catch { handlePending = false; }
    }
  }
  render();
  if (dbxReady() && (next || useDbx)) { await dbxStart(next); scheduleAutoSave(3000); return; }
  if (restored && dirty && !handlePending) toast('Du har ændringer fra sidst, som ikke er gemt i Excel-filen.');
}

/* Klik og taster */
document.addEventListener('click', e => {
  const go = e.target.closest('[data-view-go]'); if (go) { view = go.dataset.viewGo; render(); return; }
  const nav = e.target.closest('.tabs button'); if (nav) { view = nav.dataset.view; closeDrawer(); $('search').value = ''; $('fStatus').value = ''; $('fMyn').value = ''; render(); return; }
  const b = e.target.closest('[data-action]');
  if (!b) { const row = e.target.closest('tr[data-open]'); if (row) openDrawer(row.dataset.open); return; }
  const fm = $('fileMenu'); if (fm.open && b.closest('#fileMenu .menu')) fm.open = false;
  const id = b.dataset.id;
  switch (b.dataset.action) {
    case 'open': openFile(); break;
    case 'save': saveFile(); break;
    case 'saveas': saveAs(); break;
    case 'new': newFile(); break;
    case 'reconnect': reconnect(); break;
    case 'open-recent': openRecent(); break;
    case 'toggle-auto': toggleAuto(); break;
    case 'conflict-load': resolveConflict(false); break;
    case 'conflict-keep': resolveConflict(true); break;
    case 'dbx-open': dbxPicker(); break;
    case 'dbx-saveas': dbxSaveAsForm(); break;
    case 'dbx-disconnect': dbxDisconnect(); break;
    case 'dbx-login': closeModal(); dbxLogin(b.dataset.next || 'open'); break;
    case 'dbx-open-file': if (confirmDiscard()) { closeModal(); dbxOpen(b.dataset.path).catch(err => dbxFail('Filen kunne ikke hentes fra Dropbox', err, 'open')); } break;
    case 'dbx-reload':
      if (!dbx) break;
      (dirty ? dbxRpc('files/get_metadata', { path: dbx.path }).then(() => { dbxPending = false; render(); toast('Forbindelsen til Dropbox virker igen. Husk at gemme.'); }) : dbxOpen(dbx.path))
        .catch(err => { dbxPending = true; render(); dbxFail('Filen kunne ikke hentes fra Dropbox', err, 'reload'); });
      break;
    case 'close': closeModal(); break;
    case 'new-item': view === 'klage' ? klageForm() : aktForm(); break;
    case 'edit-akt': aktForm(aktById(id)); break;
    case 'edit-klage': klageForm(S.klager.find(k => k.id === id)); break;
    case 'new-klage': klageForm({}, id); break;
    case 'timeline': case 'events': case 'open-case': closeModal(); openDrawer(id); break;
    case 'close-drawer': closeDrawer(); break;
    case 'quick-rykker': eventForm(id); break;
    case 'new-event': eventForm(id); break;
    case 'edit-event': eventForm(null, id); break;
    case 'del-event': { const ev = S.events.find(x => x.id === id); if (ev && confirm('Slet hændelsen?')) { S.events = S.events.filter(x => x.id !== id); closeModal(); changed(); } break; }
    case 'trash-akt': trashAkt(id); break;
    case 'trash-klage': trashKlage(id); break;
    case 'restore': restore(id); break;
    case 'destroy': destroy(id); break;
    case 'empty-trash': emptyTrash(); break;
  }
});
$('fileInput').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if (f) { try { await loadFile(f, null); } catch (err) { showError('Filen kunne ikke åbnes', err); } } });
$('search').addEventListener('input', render);
$('fStatus').addEventListener('change', render);
$('fMyn').addEventListener('change', render);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('modal').hidden) closeModal(); else if (drawerId) closeDrawer(); else $('fileMenu').open = false; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(); }
});
window.addEventListener('beforeunload', e => { if (dirty && !leavingForAuth) { e.preventDefault(); e.returnValue = ''; } });
start();
</script>
