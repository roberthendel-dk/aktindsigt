<style>
/* Aktindsigt & Klager 4.1
   Idé: et sagsregister. Rolig, kølig papirflade, stempelblå som eneste accentfarve,
   sagstitler sat i en dokument-serif. Fristerne er det, man skal kunne aflæse på et øjeblik,
   så hver sag har en lille fristbjælke, der viser, hvor meget af fristen der er brugt. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#1B2430; --muted:#667080; --line:#DCE1E7; --line-soft:#EBEEF2;
  --stamp:#24479A; --stamp-ink:#1A3576; --stamp-soft:#E8EDF8;
  --red:#B8322A; --red-soft:#FBEAE8; --amber:#9A5B0C; --amber-bar:#D69222; --amber-soft:#FCF2E0;
  --green:#2E7A4E; --green-bar:#4C9A6C; --green-soft:#E6F3EB; --grey-bar:#AEB6C1;
  --serif:"Iowan Old Style","Charter","Bitstream Charter","Sitka Text","Palatino Linotype","Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7FA2E8;outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* ---------- Topbjælke ---------- */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top-inner{max-width:1320px;margin:0 auto;padding:0 28px;display:flex;align-items:stretch;gap:36px;min-height:64px}
.brand{display:flex;flex-direction:column;justify-content:center}
.brand h1{font:700 21px/1.1 var(--serif);margin:0;letter-spacing:-.005em}
.brand small{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;align-items:stretch}
.tabs button{border:0;background:none;padding:0 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--stamp-ink);border-bottom-color:var(--stamp)}
.tabs .n{font-size:12px;font-weight:700;background:var(--line-soft);color:var(--muted);border-radius:999px;padding:1px 7px}
.tabs button[aria-current="page"] .n{background:var(--stamp-soft);color:var(--stamp-ink)}
.filearea{margin-left:auto;display:flex;align-items:center;gap:10px}
.filechip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;max-width:260px}
.filechip .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.filechip .state{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.state.saved .dot{background:var(--green-bar)}
.state.dirty{color:var(--amber);font-weight:700}
.state.dirty .dot{background:var(--amber-bar)}
.state.none .dot{background:var(--grey-bar)}
.filemenu{position:relative}
.filemenu summary{list-style:none}
.filemenu summary::-webkit-details-marker{display:none}
.filemenu .menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(27,36,48,.14);padding:6px;min-width:200px;z-index:40}
.filemenu .menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer}
.filemenu .menu button:hover{background:var(--line-soft)}
.filemenu .menu button:disabled{color:var(--muted);cursor:default;background:none}
.filemenu .menu hr{border:0;border-top:1px solid var(--line-soft);margin:5px 4px}
.filemenu .menu p{margin:6px 10px 4px;font-size:12px;color:var(--muted);max-width:220px}

/* ---------- Knapper og felter ---------- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#C3CAD3;background:#F8F9FB}
.btn.primary{background:var(--stamp);border-color:var(--stamp);color:#fff}
.btn.primary:hover{background:var(--stamp-ink)}
.btn.danger{color:var(--red);border-color:#EFC9C5}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{padding:4px 10px;font-size:13px}
.linkbtn{border:0;background:none;padding:0;color:var(--stamp);font-weight:600;cursor:pointer;font-size:13px}
.linkbtn:hover{text-decoration:underline}
input,select,textarea{width:100%;border:1px solid #CBD2DA;border-radius:8px;padding:8px 10px;background:#fff}
input:disabled{background:var(--line-soft);color:var(--muted)}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}

/* ---------- Hovedindhold ---------- */
main{max-width:1320px;margin:0 auto;padding:28px 28px 60px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.pagehead h2{font:700 30px/1.1 var(--serif);margin:0;letter-spacing:-.01em}
.pagehead p{margin:6px 0 0;color:var(--muted)}

/* Nøgletal i én strimmel */
.figures{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:20px}
.fig{flex:1 1 150px;padding:14px 20px;border-left:1px solid var(--line-soft)}
.fig:first-child{border-left:0}
.fig .v{font-size:26px;font-weight:700;line-height:1.1}
.fig .l{font-size:13px;color:var(--muted)}
.fig.alert .v{color:var(--red)}
.fig.warn .v{color:var(--amber)}

/* Kræver handling */
.pendingbox{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--stamp);border-radius:12px;margin:-8px 0 24px;overflow:hidden}
.pendingbox summary{list-style:none;cursor:pointer;padding:14px 18px 10px;display:flex;align-items:center;gap:10px}
.pendingbox summary::-webkit-details-marker{display:none}
.pendingbox summary h3{font:700 17px/1.2 var(--serif);margin:0}
.pendingbox summary .n{font-size:12px;font-weight:700;background:var(--stamp-soft);color:var(--stamp-ink);border-radius:999px;padding:1px 8px}
.pendingbox summary .chev{margin-left:auto;color:var(--muted);font-size:13px}
.pendingbox[open] summary .chev::after{content:"Skjul"} .pendingbox:not([open]) summary .chev::after{content:"Vis"}
.attention{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:12px;margin-bottom:24px;overflow:hidden}
.attention h3{font:700 17px/1.2 var(--serif);margin:0;padding:14px 18px 10px}
.att{display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;padding:10px 18px;border-top:1px solid var(--line-soft)}
.att .t{font-family:var(--serif);font-weight:600;font-size:16px}
.att .m{font-size:13px;color:var(--muted)}
.resume{background:var(--stamp-soft);border:1px solid #C9D5EE;border-left:4px solid var(--stamp);border-radius:12px;padding:14px 18px;margin-bottom:20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.resume.conflict{background:var(--amber-soft);border-color:#EFD3A3;border-left-color:var(--amber-bar)}
.resume b{font:700 17px/1.3 var(--serif)}
.resume .meta{color:#3D4C66}
.calm{color:var(--muted);font-size:14px;margin:-6px 0 22px;display:flex;align-items:center;gap:8px}

/* Søgning og filtre */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.toolbar input{flex:1 1 280px;width:auto}
.toolbar select{width:auto;min-width:180px}

/* Registret */
.register{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:13px;font-weight:600;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:#FAFBFC;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr.case{cursor:pointer}
tbody tr.case:hover td{background:#F7F9FC}
tbody tr.case td:first-child{box-shadow:inset 3px 0 0 transparent}
tbody tr.case.s-red td:first-child{box-shadow:inset 3px 0 0 var(--red)}
tbody tr.case.s-amber td:first-child{box-shadow:inset 3px 0 0 var(--amber-bar)}
tr.year td{background:var(--bg);font:700 15px/1 var(--serif);color:var(--ink);padding:10px 14px;border-bottom:1px solid var(--line)}
tr.year span{font:400 12px var(--sans);color:var(--muted);margin-left:8px}
.ctitle{font:600 16px/1.3 var(--serif);border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
.ctitle:hover{color:var(--stamp);text-decoration:underline}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:5px;padding:1px 7px;margin-top:5px;background:var(--stamp-soft);color:var(--stamp-ink)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.date{white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{padding:36px;text-align:center;color:var(--muted)}

/* Fristbjælke */
.frist{min-width:170px}
.track{height:6px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin:6px 0 4px;width:150px}
.track span{display:block;height:100%;border-radius:99px}
.c-green .track span{background:var(--green-bar)} .c-amber .track span{background:var(--amber-bar)}
.c-red .track span{background:var(--red)} .c-grey .track span{background:var(--grey-bar)} .c-blue .track span{background:var(--stamp)}
.flabel{font-size:13px;font-weight:600}
.c-green .flabel{color:var(--green)} .c-amber .flabel{color:var(--amber)} .c-red .flabel{color:var(--red)} .c-grey .flabel{color:var(--muted)} .c-blue .flabel{color:var(--stamp)}

/* Afgørelse */
.verdict{display:flex;align-items:center;gap:7px;white-space:nowrap}
.v-good .dot{background:var(--green-bar)} .v-mid .dot{background:var(--amber-bar)} .v-bad .dot{background:var(--red)} .v-none .dot{background:transparent;border:1.5px solid var(--grey-bar)}

/* Statistik */
.stat-bar{display:flex;align-items:center;gap:10px}
.stat-bar .b{height:8px;width:120px;background:var(--line-soft);border-radius:99px;overflow:hidden}
.stat-bar .b span{display:block;height:100%;background:var(--red)}
.explain{font-size:14px;color:var(--muted);max-width:78ch;margin:0 0 16px}
.split{display:grid;grid-template-columns:1fr;gap:20px}
.split .panel .dist{max-width:560px}
.stat-bar .small{white-space:nowrap}
.section-h .btn{font:600 13px/1.4 var(--sans)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.panel h3{font:700 17px/1.2 var(--serif);margin:0 0 12px}
.dist{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:14px}
.dist .b{grid-column:1/-1;height:6px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-bottom:10px}
.dist .b span{display:block;height:100%;background:var(--stamp)}

/* ---------- Sagspanel (skuffe) ---------- */
.scrim{position:fixed;inset:0;background:rgba(27,36,48,.28);z-index:45}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:50;box-shadow:-16px 0 40px rgba(27,36,48,.16);display:flex;flex-direction:column}
.dhead{padding:20px 24px 16px;border-bottom:1px solid var(--line)}
.dhead .kind{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.dhead h3{font:700 24px/1.2 var(--serif);margin:6px 0 2px}
.xbtn{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;padding:2px 8px;border-radius:6px;color:var(--muted)}
.xbtn:hover{background:var(--line-soft);color:var(--ink)}
.dbody{padding:20px 24px 40px;overflow-y:auto;flex:1}
.dactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin:0 0 22px}
.facts div{min-width:0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:1px 0 0;font-weight:600;overflow-wrap:anywhere}
.section-h{font:700 17px/1.2 var(--serif);margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center}
.notes{white-space:pre-wrap;background:#FAFBFC;border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;font-size:14px}
.subcase{border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.subcase .facts{margin:10px 0 0}
.flow{list-style:none;margin:0;padding:0}
.flow li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line);margin-left:5px}
.flow li:last-child{border-left-color:transparent}
.flow li::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--grey-bar)}
.flow li.k-deadline::before{border-color:var(--amber-bar)}
.flow li.k-answer::before{border-color:var(--green-bar);background:var(--green-bar)}
.flow li.k-klage::before{border-color:var(--stamp)}
.flow li.k-event::before{border-color:var(--ink)}
.flow li.future{color:var(--muted)}
.flow .fd{font-size:13px;color:var(--muted)}
.flow .ft{font-weight:600}
.flow .fn{font-size:14px;color:var(--muted);white-space:pre-wrap}
.flow .today{padding-bottom:12px}
.flow .today::before{border-color:var(--stamp);background:var(--stamp)}
.flow .today .ft{color:var(--stamp);font-size:13px}

/* ---------- Dialog ---------- */
.modal{position:fixed;inset:0;background:rgba(27,36,48,.42);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:60;overflow-y:auto}
.modalbox{background:var(--surface);width:min(760px,100%);border-radius:14px;box-shadow:0 24px 60px rgba(27,36,48,.25)}
.modalhead{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.modalhead h3{margin:0;font:700 21px/1.2 var(--serif)}
.modalbody{padding:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.full{grid-column:1/-1}
.formbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.formbtns .right{margin-left:auto}
.err{color:var(--red);font-size:14px;font-weight:600}
.err:empty{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;z-index:100;max-width:min(520px,90vw);box-shadow:0 10px 30px rgba(0,0,0,.2);font-size:14px}

@media (max-width:980px){
  .top-inner{flex-wrap:wrap;gap:6px 20px;padding:10px 16px 0}
  .brand{order:1}.filearea{order:2}
  .tabs{order:3;width:100%;overflow-x:auto}
  .tabs button{padding:10px 12px}
  main{padding:20px 16px 50px}
  .split{grid-template-columns:1fr}
}
@media (max-width:720px){
  .filechip{display:none}
  .register thead{display:none}
  .register table,.register tbody,.register tr,.register td{display:block;width:100%}
  .register tr.case{padding:10px 4px;border-bottom:1px solid var(--line-soft)}
  .register td{border:0;padding:3px 14px}
  .register td[data-l]::before{content:attr(data-l) ": ";color:var(--muted);font-size:13px}
  tbody tr.case.s-red{box-shadow:inset 3px 0 0 var(--red)}
  tbody tr.case.s-amber{box-shadow:inset 3px 0 0 var(--amber-bar)}
  tbody tr.case td:first-child{box-shadow:none!important}
  .att{grid-template-columns:1fr}
  .grid2,.facts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slidein .18s ease-out}
  @keyframes slidein{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><h1>Aktindsigt &amp; Klager</h1><small>Version 4.2 (testudgave med Dropbox), udviklet af RH 🤓</small></div>
    <nav class="tabs" aria-label="Hovedmenu">
      <button data-view="akt">Aktindsigter <span class="n" id="cAkt">0</span></button>
      <button data-view="klage">Klager <span class="n" id="cKlage">0</span></button>
      <button data-view="stat">Statistik</button>
      <button data-view="trash">Papirkurv <span class="n" id="cTrash">0</span></button>
    </nav>
    <div class="filearea">
      <div class="filechip" id="fileChip" role="status" aria-live="polite"></div>
      <button class="btn primary" data-action="save" title="Gem i Excel-filen (Ctrl+S)">Gem</button>
      <details class="filemenu" id="fileMenu">
        <summary class="btn">Fil ▾</summary>
        <div class="menu">
          <button data-action="open">Åbn Excel-fil…</button>
          <button data-action="open-recent" id="recentBtn">Åbn senest brugte fil</button>
          <button data-action="dbx-open" id="dbxOpenBtn">Åbn fra Dropbox…</button>
          <hr>
          <button data-action="saveas">Gem som ny fil…</button>
          <button data-action="dbx-saveas" id="dbxSaveBtn">Gem i Dropbox som…</button>
          <hr>
          <button data-action="new">Start en tom fil</button>
          <hr>
          <button data-action="toggle-auto" id="autoBtn"></button>
          <p id="fileNote"></p>
        </div>
      </details>
      <input id="fileInput" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    </div>
  </div>
</header>
<main>
  <div class="pagehead">
    <div><h2 id="title"></h2><p id="subtitle"></p></div>
    <button id="newBtn" class="btn primary" data-action="new-item"></button>
  </div>
  <div id="resume"></div>
  <div id="figures"></div>
  <div id="attention"></div>
  <div id="pending"></div>
  <div id="controls" class="toolbar">
    <input id="search" type="search" placeholder="Søg efter titel, myndighed, journalist eller sagsnummer" aria-label="Søg">
    <select id="fStatus" aria-label="Filtrer på status"></select>
    <select id="fMyn" aria-label="Filtrer på myndighed"></select>
  </div>
  <div id="content"></div>
</main>

<div id="scrim" class="scrim" hidden data-action="close-drawer"></div>
<aside id="drawer" class="drawer" hidden aria-labelledby="dTitle" role="dialog"></aside>

<div id="modal" class="modal" hidden>
  <div class="modalbox" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modalhead"><h3 id="modalTitle"></h3><button type="button" class="xbtn" data-action="close" aria-label="Luk">×</button></div>
    <div id="modalBody" class="modalbody"></div>
  </div>
</div>
<datalist id="dlMyn"></datalist>
<datalist id="dlJour"></datalist>
<script>
'use strict';
/* =====================================================================
   Konstanter
   ===================================================================== */
const VERSION = '4.2';
const LOVFRIST = 7; // arbejdsdage, offentlighedslovens § 36
const LS_KEY = 'aktindsigt_klager_v4_test';
// Dropbox: indsæt app-nøglen (App key) fra Dropbox App Console. Tom = Dropbox er slået fra.
const DROPBOX_APP_KEY = 'zjg5dswmxtqrnrx';
const AKT_STATUS = ['Under behandling', 'Afgjort'];
const AKT_AFG = ['Afventer', 'Fuld aktindsigt', 'Delvis aktindsigt', 'Afslag', 'Henlagt'];
const KL_INSTANS = ['Myndigheden selv (genovervejelse)', 'Ankestyrelsen', 'Folketingets Ombudsmand', 'Datatilsynet', 'Nævnenes Hus', 'Anden'];
const KL_STATUS = ['Under behandling', 'Afgjort'];
/* En klage er afgjort, så snart klageinstansen har truffet en afgørelse, også ved hjemvisning. */
function normKlage(k) {
  if (k.status === 'Hjemvist til genbehandling') { k.status = 'Afgjort'; if (!k.resultat || k.resultat === 'Afventer') k.resultat = 'Hjemvist'; }
  if (k.resultat && k.resultat !== 'Afventer') k.status = 'Afgjort';
  return k;
}
const KL_RES = ['Afventer', 'Medhold (Omgjort)', 'Delvis medhold', 'Hjemvist', 'Ikke medhold (Stadfæstet)', 'Afvist', 'Henvist til anden klageinstans'];
const KL_WIN = ['Medhold (Omgjort)', 'Delvis medhold', 'Hjemvist'];
const EV_TYPES = ['Modtaget kvittering', 'Modtaget anmodning om præcisering', 'Modtaget anmodning om afgrænsning', 'Sendt rykker', 'Modtaget fristudsættelse', 'Sendt indsigelse', 'Klage sendt', 'Hjemvist', 'Genbehandling', 'Modtaget svar', 'Notat'];
const KL_EV_TYPES = ['Anmodet om genovervejelse hos myndigheden', 'Myndigheden fastholdt afgørelsen', 'Sendt videre til klageinstansen', 'Modtaget kvittering', 'Klageinstansen har udskudt afgørelsen', 'Sendt rykker', 'Modtaget myndighedens udtalelse', 'Sendt bemærkninger', 'Hjemvist', 'Genbehandling', 'Modtaget afgørelse', 'Notat'];
const FRIST_TYPES = ['Modtaget fristudsættelse', 'Klageinstansen har udskudt afgørelsen'];

/* =====================================================================
   Datoer og arbejdsdage (alt regnes i lokal tid som 'åååå-mm-dd')
   ===================================================================== */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const toDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const today = () => ymd(new Date());
const isYmd = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const fmt = s => isYmd(s) ? `${s.slice(8, 10)}.${s.slice(5, 7)}.${s.slice(0, 4)}` : '';

function easter(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
    f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
    i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mo = Math.floor((h + l - 7 * m + 114) / 31), da = (h + l - 7 * m + 114) % 31 + 1;
  return new Date(y, mo - 1, da, 12);
}
const holidayCache = {};
function holidays(y) {
  if (holidayCache[y]) return holidayCache[y];
  const e = easter(y);
  // Helligdage + dage hvor myndighederne holder lukket (grundlovsdag, juleaften, nytårsaften)
  const set = new Set([`${y}-01-01`, `${y}-06-05`, `${y}-12-24`, `${y}-12-25`, `${y}-12-26`, `${y}-12-31`]);
  const offsets = [-3, -2, 1, 39, 49, 50]; // skærtorsdag, langfredag, 2. påskedag, Kr. himmelfart, pinsedag, 2. pinsedag
  if (y <= 2023) offsets.push(26); // store bededag (afskaffet fra 2024)
  offsets.forEach(o => { const z = new Date(e); z.setDate(z.getDate() + o); set.add(ymd(z)); });
  return (holidayCache[y] = set);
}
function isWorkday(s) { const d = toDate(s), wd = d.getDay(); return wd !== 0 && wd !== 6 && !holidays(d.getFullYear()).has(s); }
function addWorkdays(start, n) {
  if (!isYmd(start)) return '';
  const d = toDate(start); let c = 0;
  while (c < n) { d.setDate(d.getDate() + 1); if (isWorkday(ymd(d))) c++; }
  return ymd(d);
}
/* Antal arbejdsdage fra 'from' til 'to' (positivt hvis to er senere) */
function workdiff(from, to) {
  if (!isYmd(from) || !isYmd(to)) return null;
  const a = toDate(from), b = toDate(to), sign = a <= b ? 1 : -1, d = new Date(a); let c = 0;
  while (ymd(d) !== to) { d.setDate(d.getDate() + sign); if (isWorkday(ymd(d))) c += sign; }
  return c;
}
const dage = n => `${n} arbejdsdag${Math.abs(n) === 1 ? '' : 'e'}`;

/* =====================================================================
   Tilstand
   ===================================================================== */
let S = emptyState();
let view = 'akt';
let fileHandle = null, fileName = '', fileModified = 0, dirty = false, oldFormat = false, handlePending = false, lastName = '', backupAt = 0;

function emptyState() { return { akt: [], klager: [], events: [], trash: [] }; }
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const esc = (s = '') => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const $ = id => document.getElementById(id);

function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ S, fileName, dirty, oldFormat, savedAt: new Date().toISOString() })); }
  catch (e) { console.warn('Kunne ikke gemme sikkerhedskopi', e); }
}
function changed() { dirty = true; saveLocal(); render(); scheduleAutoSave(); }

/* Afledte værdier */
const origFrist = a => addWorkdays(a.dato, LOVFRIST);
const gaeldendeFrist = a => a.frist || origFrist(a);
const aktById = id => S.akt.find(a => a.id === id);
const klagerFor = id => S.klager.filter(k => k.aktId === id);
const eventsFor = (id) => S.events.filter(e => e.sagId === id).sort((a, b) => (a.dato || '').localeCompare(b.dato || ''));

/* Hvor mange arbejdsdage er en frist overskredet (svar for sent, eller stadig åben efter fristen) */
function overskridelse(a, frist) {
  if (!isYmd(frist)) return 0;
  const end = a.svardato || (a.status === 'Afgjort' ? '' : today());
  if (!end) return 0;
  const n = workdiff(frist, end);
  return n > 0 ? n : 0;
}
function aktFristInfo(a) {
  const dl = gaeldendeFrist(a);
  if (!dl) return { txt: 'Ingen frist', cls: 'grey' };
  if (a.svardato) {
    const n = workdiff(dl, a.svardato);
    return n > 0 ? { txt: `Besvaret ${dage(n)} for sent`, cls: 'red' } : { txt: 'Besvaret inden for fristen', cls: 'green' };
  }
  if (a.status === 'Afgjort') return { txt: 'Afgjort (svardato mangler)', cls: 'grey' };
  const n = workdiff(today(), dl);
  if (n < 0) return { txt: `Overskredet med ${dage(-n)}`, cls: 'red', over: true };
  if (n === 0) return { txt: 'Frist i dag', cls: 'amber', soon: true };
  if (n <= 2) return { txt: `${dage(n)} tilbage`, cls: 'amber', soon: true };
  return { txt: `${dage(n)} tilbage`, cls: 'blue' };
}
function klageInfo(k) {
  if (k.status === 'Afgjort') return { txt: k.resultat === 'Hjemvist' ? 'Afgjort, hjemvist til genbehandling' : 'Afgjort', cls: 'grey' };
  const t = today();
  if (isYmd(k.frist)) {
    const n = workdiff(t, k.frist);
    if (n < 0) return { txt: `Forventet afgørelse overskredet med ${dage(-n)}`, cls: 'red', over: true };
    return { txt: `Forventet afgørelse om ${dage(n)}`, cls: 'blue' };
  }
  return { txt: 'Ingen forventet afgørelsesdato', cls: 'grey' };
}

const VIEWS = {
  akt: ['Aktindsigter', 'Dine anmodninger, frister og afgørelser', '+ Ny aktindsigt'],
  klage: ['Klager', 'Klager over afslag, hjemvisninger og resultater', '+ Ny klage'],
  stat: ['Statistik', 'Hvilke myndigheder overholder lovfristen, og hvilke gør ikke?', ''],
  trash: ['Papirkurv', 'Slettede sager kan gendannes eller slettes permanent', '']
};
let drawerId = null;

function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.dataset.view === view ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  $('cAkt').textContent = S.akt.length; $('cKlage').textContent = S.klager.length; $('cTrash').textContent = S.trash.length;
  const [t, st, nb] = VIEWS[view];
  $('title').textContent = t; $('subtitle').textContent = st;
  $('newBtn').textContent = nb; $('newBtn').hidden = !nb;
  $('controls').hidden = !['akt', 'klage'].includes(view);
  renderFile(); renderResume(); renderFigures(); renderAttention(); renderPending(); renderFilters(); renderDatalists();
  if (view === 'akt') renderAkt();
  else if (view === 'klage') renderKlage();
  else if (view === 'stat') renderStat();
  else renderTrash();
  if (drawerId) renderDrawer();
}

function renderFile() {
  let state, cls;
  if (!fileName) { cls = dirty ? 'dirty' : 'none'; state = dirty ? 'Ikke gemt i en fil' : 'Ingen fil åben'; }
  else if (handlePending || dbxPending) { cls = dirty ? 'dirty' : 'none'; state = dirty ? 'Ikke gemt, filen er ikke hentet' : 'Filen er ikke hentet endnu'; }
  else if (conflict) { cls = 'dirty'; state = 'Ikke gemt, filen er ændret et andet sted'; }
  else if (saving) { cls = 'none'; state = dbx ? 'Gemmer i Dropbox…' : 'Gemmer…'; }
  else if (dirty) { cls = 'dirty'; state = { net: 'Ikke gemt, prøver igen om lidt', locked: 'Ikke gemt, filen er åben i Excel', perm: 'Ikke gemt, tryk “Gem”', login: 'Ikke gemt, log ind i Dropbox igen' }[autoErr] || (dbx ? 'Ikke gemt i Dropbox' : 'Ikke gemt'); }
  else { cls = 'saved'; state = oldFormat ? 'Gammelt format, gem for at konvertere' : lastSavedAt ? `Gemt${dbx ? ' i Dropbox' : ''} kl. ${clock(lastSavedAt)}` : dbx ? 'Alt er gemt i Dropbox' : 'Alt er gemt'; }
  if (oldFormat && dirty) state = 'Ikke gemt, gammelt format';
  $('fileChip').innerHTML = `<span class="name" title="${esc(fileName)}">${esc(fileName || 'Ingen Excel-fil')}</span><span class="state ${cls}"><span class="dot"></span>${esc(state)}</span>`

  $('fileNote').textContent = (autoOn && autoTarget() ? 'Appen gemmer automatisk. ' : '') + (dbx ? '“Gem” gemmer filen i Dropbox.' : canFS ? '“Gem” skriver direkte i den åbne Excel-fil.' : 'Din browser kan ikke skrive direkte i filen. “Gem” henter en ny kopi til Overførsler.');
}

function renderResume() {
  const rb = $('recentBtn');
  rb.disabled = !canFS || !lastName;
  rb.textContent = lastName ? 'Åbn senest brugte fil (' + lastName + ')' : 'Åbn senest brugte fil';
  rb.title = !canFS ? 'Kræver Chrome eller Edge' : !lastName ? 'Du har ikke åbnet en fil i appen endnu' : '';
  for (const id of ['dbxOpenBtn', 'dbxSaveBtn']) { $(id).hidden = !DROPBOX_APP_KEY; $(id).disabled = !dbxReady(); $(id).title = dbxReady() ? '' : 'Dropbox virker kun, når appen åbnes fra sin webadresse'; }
  $('autoBtn').textContent = autoOn ? '✓ Gem automatisk' : 'Gem automatisk (slået fra)';
  if (conflict) { $('resume').innerHTML = conflictBanner(); return; }
  if (dbxPending && dbx) {
    $('resume').innerHTML = `<div class="resume"><div><b>${esc(dbx.name)} kunne ikke hentes fra Dropbox</b><div class="meta">${dirty ? 'Dine ændringer, som ikke er gemt, er bevaret.' : 'Det, du ser nu, er browserens kopi.'} Tjek internetforbindelsen, og prøv igen.</div></div><button class="btn primary" data-action="dbx-reload">Prøv igen</button></div>`;
    return;
  }
  if (!handlePending) { $('resume').innerHTML = ''; return; }
  const txt = dirty
    ? 'Du har ændringer fra sidst, som ikke er gemt. De bliver bevaret, og du kan gemme dem i filen bagefter.'
    : (S.akt.length || S.klager.length) ? 'Det, du ser nu, er browserens kopi. Hent filen for at få den nyeste version, fx hvis den er ændret på en anden computer.' : 'Det er den fil, du brugte sidst. Klik for at hente den.';
  $('resume').innerHTML = `<div class="resume"><div><b>Fortsæt med ${esc(lastName)}</b><div class="meta">${txt}</div></div><button class="btn primary" data-action="reconnect">${dirty ? 'Forbind til filen' : 'Hent filen'}</button></div>`;
}

function renderFigures() {
  let data = [];
  if (view === 'akt') {
    const active = S.akt.filter(a => a.status !== 'Afgjort');
    const over = active.filter(a => aktFristInfo(a).over).length, soon = active.filter(a => aktFristInfo(a).soon).length;
    const done = S.akt.filter(a => a.medhold && a.medhold !== 'Afventer');
    const full = done.length ? Math.round(done.filter(a => a.medhold === 'Fuld aktindsigt').length / done.length * 100) : 0;
    data = [[active.length, 'under behandling'], [over, 'over fristen', over ? 'alert' : ''], [soon, 'frist inden for 2 dage', soon ? 'warn' : ''], [full + ' %', 'fik fuld aktindsigt'], [S.akt.filter(a => a.medhold === 'Afslag').length, 'afslag']];
  } else if (view === 'klage') {
    const vers = S.klager.filter(k => k.status !== 'Afgjort'), kdone = S.klager.filter(k => k.resultat && k.resultat !== 'Afventer');
    const win = kdone.length ? Math.round(kdone.filter(k => KL_WIN.includes(k.resultat)).length / kdone.length * 100) : 0;
    const over = vers.filter(k => klageInfo(k).over).length;
    data = [[vers.length, 'verserende'], [over, 'over forventet afgørelse', over ? 'alert' : ''], [kdone.length, 'afgjort'], [win + ' %', 'medhold eller hjemvisning'], [S.klager.filter(k => k.resultat === 'Hjemvist').length, 'hjemvist']];
  }
  $('figures').innerHTML = data.length ? `<div class="figures">${data.map(([v, l, c]) => `<div class="fig ${c || ''}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('')}</div>` : '';
}

function renderAttention() {
  if (view !== 'akt' && view !== 'klage') { $('attention').innerHTML = ''; return; }
  const items = [];
  S.akt.filter(a => a.status !== 'Afgjort').forEach(a => { const fi = aktFristInfo(a); if (fi.over || fi.soon) items.push({ id: a.id, t: a.emne || 'Uden titel', m: `${a.myndighed || 'Ukendt myndighed'}, frist ${fmt(gaeldendeFrist(a))}`, fi, rykker: true }); });
  S.klager.filter(k => k.status !== 'Afgjort').forEach(k => { const ki = klageInfo(k); if (ki.over || ki.soon) items.push({ id: k.id, t: 'Klage: ' + (aktById(k.aktId)?.emne || k.sagsnr || 'uden titel'), m: k.instans, fi: ki, rykker: true }); });
  const unlinked = S.klager.filter(k => !aktById(k.aktId));
  unlinked.forEach(k => items.push({ id: k.id, t: 'Klage ' + (k.sagsnr || '') + ' er ikke koblet til en aktindsigt', m: k._emne ? `I filen stod der “${k._emne}”` : '', fi: { txt: 'Vælg aktindsigt', cls: 'amber' }, fix: true }));
  if (!items.length) {
    $('attention').innerHTML = (S.akt.length || S.klager.length) ? `<p class="calm"><span class="dot" style="background:var(--green-bar)"></span>Ingen frister kræver handling lige nu.</p>` : '';
    return;
  }
  items.sort((a, b) => (b.fi.cls === 'red') - (a.fi.cls === 'red'));

    ${items.map(i => `<div class="att"><div><div class="t">${esc(i.t)}</div>${i.m ? `<div class="m">${esc(i.m)}</div>` : ''}</div>
      <div class="c-${i.fi.cls}"><span class="flabel">${esc(i.fi.txt)}</span></div>
      <div class="formbtns">${i.fix ? `<button class="btn sm" data-action="edit-klage" data-id="${i.id}">Kobl klagen</button>` : `<button class="btn sm" data-action="quick-rykker" data-id="${i.id}">Registrér rykker</button><button class="btn sm" data-action="open-case" data-id="${i.id}">Åbn sag</button>`}</div></div>`).join('')}
  </section>`;
}

}
const myndigheder = () => [...new Set(S.akt.map(a => (a.myndighed || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'da'));
function renderDatalists() {
  $('dlMyn').innerHTML = myndigheder().map(m => `<option value="${esc(m)}">`).join('');
  $('dlJour').innerHTML = [...new Set(S.akt.map(a => (a.journalist || '').trim()).filter(Boolean))].map(m => `<option value="${esc(m)}">`).join('');
}
const q = () => $('search').value.trim().toLowerCase();
const hit = fields => { const s = q(); return !s || fields.some(f => String(f || '').toLowerCase().includes(s)); };

/* Fristbjælke: hvor stor en del af fristen er brugt */
function fristCell(a) {
  const fi = aktFristInfo(a), dl = gaeldendeFrist(a);
  if (!dl) return `<div class="frist c-grey"><span class="flabel">Ingen frist</span></div>`;
  const total = Math.max(1, workdiff(a.dato, dl) || 1);
  const end = a.svardato || (a.status === 'Afgjort' ? '' : today());
  const used = end ? workdiff(a.dato, end) : total;
  const pct = Math.max(4, Math.min(100, used / total * 100));
  return `<div class="frist c-${fi.cls}"><span class="date">${fmt(dl)}</span>${a.frist ? ' <span class="small muted">forlænget</span>' : ''}
    <div class="track" aria-hidden="true"><span style="width:${pct}%"></span></div><span class="flabel">${esc(fi.txt)}</span></div>`;
}
function verdict(v) {
  const cls = { 'Fuld aktindsigt': 'v-good', 'Medhold (Omgjort)': 'v-good', 'Delvis aktindsigt': 'v-mid', 'Delvis medhold': 'v-mid', 'Hjemvist': 'v-mid', 'Afslag': 'v-bad', 'Ikke medhold (Stadfæstet)': 'v-bad', 'Afvist': 'v-bad' }[v] || 'v-none';
  return `<span class="verdict ${cls}"><span class="dot"></span>${esc(v || 'Afventer')}</span>`;
}

function renderAkt() {
  const fs = $('fStatus').value, fm = $('fMyn').value;
  if (!S.akt.length) {
    $('content').innerHTML = `<div class="register empty"><p>Der er ingen aktindsigter endnu.</p><div class="formbtns" style="justify-content:center"><button class="btn primary" data-action="new-item">+ Ny aktindsigt</button><button class="btn" data-action="open">Åbn Excel-fil…</button></div></div>`;
    return;
  }
  const rows = S.akt.filter(a => {
    const fi = aktFristInfo(a);
    if (fs === 'Over fristen' && !fi.over) return false;
    if (fs === 'Frist inden for 2 dage' && !fi.soon) return false;
    if (AKT_STATUS.includes(fs) && a.status !== fs) return false;
    if (fm && (a.myndighed || '').trim() !== fm) return false;
    return hit([a.emne, a.myndighed, a.journalist, a.sagsnr, a.bemaerkning, a.medhold, ...klagerFor(a.id).map(k => k.sagsnr)]);
  }).sort((a, b) => (b.dato || '').localeCompare(a.dato || ''));
  let html = '', year = null;
  rows.forEach(a => {
    const y = (a.dato || '').slice(0, 4) || 'Uden dato';
    if (y !== year) { year = y; const n = rows.filter(r => ((r.dato || '').slice(0, 4) || 'Uden dato') === y).length; html += `<tr class="year"><td colspan="5">${esc(y)}<span>${n} sag${n === 1 ? '' : 'er'}</span></td></tr>`; }
    const fi = aktFristInfo(a), kl = klagerFor(a.id);
    const meta = [a.myndighed, a.sagsnr ? 'sagsnr. ' + a.sagsnr : '', a.journalist].filter(Boolean).map(esc).join(', ');
    html += `<tr class="case s-${fi.cls}" data-open="${a.id}">
      <td><button class="ctitle" data-action="open-case" data-id="${a.id}">${esc(a.emne || 'Uden titel')}</button><div class="meta">${meta}</div>
        ${kl.map(k => `<span class="tag">Klaget, ${esc(k.status.toLowerCase())}</span>`).join(' ')}</td>
      <td class="date" data-l="Anmodet">${fmt(a.dato)}</td>
      <td data-l="Frist">${fristCell(a)}</td>
      <td class="date" data-l="Svar">${a.svardato ? fmt(a.svardato) : '<span class="muted">Afventer</span>'}</td>
      <td data-l="Afgørelse">${verdict(a.medhold)}</td></tr>`;
  });
  $('content').innerHTML = `<div class="register"><table><thead><tr><th>Sag</th><th>Anmodet</th><th>Svarfrist</th><th>Svar modtaget</th><th>Afgørelse</th></tr></thead>
    <tbody>${html || '<tr><td colspan="5" class="empty">Ingen sager passer på søgningen.</td></tr>'}</tbody></table></div>`;
}

function renderKlage() {
  const fs = $('fStatus').value, fm = $('fMyn').value;
  if (!S.klager.length) { $('content').innerHTML = `<div class="register empty"><p>Der er ingen klager endnu. Du kan oprette en klage fra en aktindsigt.</p></div>`; return; }
  const rows = S.klager.filter(k => {
    const a = aktById(k.aktId);
    if (fs === 'Over forventet afgørelse' && !klageInfo(k).over) return false;
    if (fs === 'Ikke koblet' && a) return false;
    if (KL_STATUS.includes(fs) && k.status !== fs) return false;
    if (fm && k.instans !== fm) return false;
    return hit([k.sagsnr, k.instans, k.resultat, k.bemaerkning, a?.emne, a?.myndighed, a?.sagsnr]);
  }).sort((a, b) => (b.dato || '').localeCompare(a.dato || ''));
  $('content').innerHTML = `<div class="register"><table><thead><tr><th>Klagen gælder</th><th>Klageinstans</th><th>Klaget</th><th>Forventet afgørelse</th><th>Resultat</th></tr></thead><tbody>
    ${rows.map(k => {
      const a = aktById(k.aktId), ki = klageInfo(k);
      return `<tr class="case s-${ki.cls}" data-open="${k.id}">
        <td><button class="ctitle" data-action="open-case" data-id="${k.id}">${esc(a ? a.emne : 'Ikke koblet til en aktindsigt')}</button>
          <div class="meta">${[a?.myndighed, k.sagsnr ? 'klagesag ' + k.sagsnr : ''].filter(Boolean).map(esc).join(', ')}</div>

        <td data-l="Instans">${esc(k.instans)}</td>
        <td class="date" data-l="Klaget">${fmt(k.dato)}</td>
        <td data-l="Forventet"><div class="frist c-${ki.cls}"><span class="date">${fmt(k.frist) || '<span class="muted">Ikke oplyst</span>'}</span><div><span class="flabel">${esc(ki.txt)}</span></div></div></td>
        <td data-l="Resultat">${verdict(k.resultat)}<div class="meta">${esc(k.status)}</div></td></tr>`;
    }).join('') || '<tr><td colspan="5" class="empty">Ingen klager passer på søgningen.</td></tr>'}
  </tbody></table></div>`;
}

function renderStat() {
  const by = {};
  S.akt.forEach(a => {
    const n = (a.myndighed || '').trim() || 'Ukendt';
    const v = by[n] ??= { navn: n, sager: 0, besvaret: 0, svartid: 0, overLov: 0, overGld: 0, dageOver: 0, ext: 0, rem: 0, kl: 0, klAfg: 0, klWin: 0, klVers: 0 };
    v.sager++;
    klagerFor(a.id).forEach(k => { v.kl++; if (k.resultat && k.resultat !== 'Afventer') { v.klAfg++; if (KL_WIN.includes(k.resultat)) v.klWin++; } if (k.status !== 'Afgjort') v.klVers++; });
    if (a.svardato && a.dato) { v.besvaret++; v.svartid += Math.max(0, workdiff(a.dato, a.svardato)); }
    const ol = overskridelse(a, origFrist(a)); if (ol > 0) { v.overLov++; v.dageOver += ol; }
    if (overskridelse(a, gaeldendeFrist(a)) > 0) v.overGld++;
    S.events.filter(e => e.sagId === a.id).forEach(e => { if (e.type === 'Sendt rykker') v.rem++; if (e.type === 'Modtaget fristudsættelse') v.ext++; });
  });
  const dec = x => x.toFixed(1).replace('.', ',');
  const rows = Object.values(by).map(v => ({ ...v, andel: v.sager ? Math.round(v.overLov / v.sager * 100) : 0 })).sort((a, b) => b.andel - a.andel || b.overLov - a.overLov || b.sager - a.sager);
  const tot = S.akt.length, overLov = S.akt.filter(a => overskridelse(a, origFrist(a)) > 0).length, overGld = S.akt.filter(a => overskridelse(a, gaeldendeFrist(a)) > 0).length;
  const besv = S.akt.filter(a => a.svardato && a.dato), gns = besv.length ? dec(besv.reduce((s, a) => s + Math.max(0, workdiff(a.dato, a.svardato)), 0) / besv.length) : '–';
  const afg = AKT_AFG.map(x => [x, S.akt.filter(a => (a.medhold || 'Afventer') === x).length]), max = Math.max(1, ...afg.map(x => x[1]));
  $('content').innerHTML = `
  <div class="figures"><div class="fig"><div class="v">${tot}</div><div class="l">sager i alt</div></div>
    <div class="fig"><div class="v">${gns}</div><div class="l">arbejdsdage i gennemsnitlig svartid</div></div>
    <div class="fig ${overLov ? 'alert' : ''}"><div class="v">${overLov}</div><div class="l">over lovfristen på 7 dage</div></div>
    <div class="fig"><div class="v">${overGld}</div><div class="l">over den gældende frist</div></div>
    <div class="fig"><div class="v">${S.events.filter(e => e.type === 'Modtaget fristudsættelse').length}</div><div class="l">fristudsættelser</div></div></div>

function flowFor(a) {
  const ev = [];
  const add = (dato, t, note = '', k = '', evId = '') => { if (isYmd(dato)) ev.push({ dato, t, note, k, evId }); };
  add(a.dato, 'Anmodning sendt', a.myndighed);
  add(origFrist(a), 'Lovfrist, 7 arbejdsdage', '', 'k-deadline');
  if (a.frist && a.frist !== origFrist(a)) add(a.frist, 'Gældende svarfrist', '', 'k-deadline');
  eventsFor(a.id).forEach(e => add(e.dato, e.type, [e.note, e.nyFrist ? 'Ny frist ' + fmt(e.nyFrist) : ''].filter(Boolean).join('\n'), 'k-event', e.id));
  add(a.svardato, 'Svar modtaget', a.medhold && a.medhold !== 'Afventer' ? a.medhold : '', 'k-answer');
  klagerFor(a.id).forEach(k => {
    add(k.dato, (/^Myndigheden selv/.test(k.instans || '') ? 'Anmodet om genovervejelse hos myndigheden' : 'Klage sendt til ' + (k.instans || 'klageinstans')), k.sagsnr ? 'Klagesag ' + k.sagsnr : '', 'k-klage');
    eventsFor(k.id).forEach(e => add(e.dato, 'Klage: ' + e.type.toLowerCase(), [e.note, e.nyFrist ? 'Ny frist ' + fmt(e.nyFrist) : ''].filter(Boolean).join('\n'), 'k-klage', e.id));
    if (k.status !== 'Afgjort') add(k.frist, 'Forventet klageafgørelse', '', 'k-deadline');
    add(k.genbehandlingFrist, 'Frist for genbehandling', '', 'k-deadline');
  });
  return ev;
}
function flowHtml(ev) {
  const t = today(); let html = '', shown = false;
  ev.sort((x, y) => x.dato.localeCompare(y.dato)).forEach(e => {
    if (!shown && e.dato > t) { html += `<li class="today"><div class="ft">I dag, ${fmt(t)}</div></li>`; shown = true; }
    html += `<li class="${e.k}${e.dato > t ? ' future' : ''}"><div class="fd">${fmt(e.dato)}</div><div class="ft">${esc(e.t)}${e.evId ? ` <button class="linkbtn" data-action="edit-event" data-id="${e.evId}">Rediger</button>` : ''}</div>${e.note ? `<div class="fn">${esc(e.note)}</div>` : ''}</li>`;
  });
  return `<ol class="flow">${html}</ol>`;
}

function trashAkt(id) {
  const a = aktById(id); if (!a) return;
  const kl = klagerFor(id), ids = new Set([id, ...kl.map(k => k.id)]);
  const evs = S.events.filter(e => ids.has(e.sagId));
  const msg = kl.length ? `Aktindsigten flyttes til papirkurven sammen med ${kl.length} klage${kl.length === 1 ? '' : 'r'}. Fortsæt?` : 'Flyt aktindsigten til papirkurven?';
  if (!confirm(msg)) return;
  S.trash.push({ id: uid(), type: 'akt', titel: a.emne, slettet: new Date().toISOString(), data: { akt: a, klager: kl, events: evs } });
  S.akt = S.akt.filter(x => x.id !== id); S.klager = S.klager.filter(k => !ids.has(k.id)); S.events = S.events.filter(e => !ids.has(e.sagId));
  closeModal(); closeDrawer(); changed(); toast('Flyttet til papirkurven');
}
function trashKlage(id) {
  const k = S.klager.find(x => x.id === id); if (!k || !confirm('Flyt klagen til papirkurven?')) return;
